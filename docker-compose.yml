services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    # Not published to the host - only the backend container needs the database.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Go Backend API
  backend:
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-mydatabase}
      # Used only to create the first admin account on an empty database.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: comma separated list of origins allowed to call the API from a browser.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    # Reached through Caddy, not published directly.
    expose:
      - "8080"
    volumes:
      # Item photos must outlive the container - without this every
      # stop/start or rebuild throws away every photo ever uploaded.
      - uploads_data:/app/uploads
    depends_on:
      - db

  # SvelteKit Frontend
  frontend:
    build:
      context: ./frontend
      target: production
    restart: always
    expose:
      - "80"

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config: