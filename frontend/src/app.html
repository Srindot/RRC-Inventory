<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
		<title>Robotics Research Centre</title>
		<script>
			// Theme before first paint, so light-mode users never see a dark flash.
			// Dark (Rosé Pine) unless the person picked light with the header button.
			// Tabler reads data-theme / data-bs-theme.
			var t = 'dark';
			try {
				if (localStorage.getItem('theme') === 'light') t = 'light';
			} catch (e) {}
			document.documentElement.dataset.theme = t;
			document.documentElement.dataset.bsTheme = t;
		</script>
		<style>
			* {
				box-sizing: border-box;
			}
			html {
				background-color: #191724;
			}
			html[data-theme='light'] {
				background-color: #faf4ed;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
