<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
		<title>Robotics Research Centre</title>
		<script>
			// Theme before first paint, so light-mode users never see a dark flash.
			// Dark (Rosé Pine) unless the person picked light with the header button.
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		<style>
			* {
				box-sizing: border-box;
			}
			html {
				font-size: 16px;
				line-height: 1.5;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
